name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Locate Flutter project
        run: |
          if [ -f pubspec.yaml ]; then
            echo "PD=." >> $GITHUB_ENV
          elif [ -f auto_ledger/pubspec.yaml ]; then
            echo "PD=auto_ledger" >> $GITHUB_ENV
          elif [ -f "auto_ledger-上传包/pubspec.yaml" ]; then
            echo "PD=auto_ledger-上传包" >> $GITHUB_ENV
          else
            echo "::error::pubspec.yaml not found - check repository root layout"
            exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.50.0'
          cache: true

      - name: Flutter version
        run: cd "$PD" && flutter --version

      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Fix Gradle wrapper URL
        run: |
          cd "$PD"
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's|^distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-9.5.0-all.zip|' android/gradle/wrapper/gradle-wrapper.properties
            grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Get dependencies
        run: cd "$PD" && flutter pub get

      - name: Analyze (allow issues)
        continue-on-error: true
        run: cd "$PD" && flutter analyze

      - name: Build release APK
        run: cd "$PD" && flutter build apk --release

      - name: Copy APK to root
        run: cp "$PD/build/app/outputs/flutter-apk/app-release.apk" ./app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app-release.apk
          retention-days: 30
